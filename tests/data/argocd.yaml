# Same app-list response as `checks`, but with the description annotation
# on the Application's own metadata - the reader must pick it up from
# here, not from the (now description-less) StatefulSet manifest.
ps_with_description:
  - cmd: argocd app get namespace/bl01t
    rsp: ""
  - cmd: argocd app list --app-namespace namespace -o yaml
    rsp: |
      - metadata:
          creationTimestamp: "2024-07-12T13:42:50Z"
          name: bl01t-ea-test-01
          annotations:
            epics-containers.github.io/description: my nice service
        spec:
          source:
            targetRevision: main
        status:
          health:
            status: Healthy
          resources:
            - kind: StatefulSet
              name: bl01t-ea-test-01

# `ec ps` reads every column from the one `argocd app list` below: no
# per-app `argocd app manifests` call follows it. The apps cover each
# column's cases: a stopped service, labels (properties), an app with no
# sync operation yet (empty last sync), OutOfSync/Progressing, and an
# app-of-apps umbrella that ps must skip.
ps:
  - cmd: argocd app get namespace/bl01t
    rsp: ""
  - cmd: argocd app list --app-namespace namespace -o yaml
    rsp: |
      - metadata:
          name: bl01t
        spec:
          source:
            targetRevision: main
        status:
          health:
            status: Healthy
          resources:
            - kind: Application
              name: bl01t-ea-test-01
      - metadata:
          name: bl01t-ea-test-01
          annotations:
            epics-containers.github.io/description: my nice service
          labels:
            argocd.argoproj.io/instance: bl01t
            location: bench
            argocd.argoproj.io/team: optics
        spec:
          source:
            targetRevision: 2024.7.1
        status:
          health:
            status: Healthy
          sync:
            status: Synced
          operationState:
            finishedAt: "2026-09-22T09:03:19Z"
          resources:
            - kind: StatefulSet
              name: bl01t-ea-test-01
      - metadata:
          name: bl01t-mo-sim-01
          labels:
            STOPPED: "1"
        spec:
          source:
            targetRevision: 2024.7.2
        status:
          health:
            status: Healthy
          sync:
            status: Synced
          operationState:
            finishedAt: "2026-09-21T14:12:02Z"
          resources:
            - kind: StatefulSet
              name: bl01t-mo-sim-01
      - metadata:
          name: bl01t-di-cam-01
        spec:
          source:
            targetRevision: main
        status:
          health:
            status: Progressing
          sync:
            status: OutOfSync

# `ec set-desc` on a service that already has a services.<name> entry:
# only the description leaf key is pushed (never enabled/targetRevision),
# in a single commit.
set_desc:
  - cmd: argocd app get namespace/bl01t
    rsp: ""
  - cmd: argocd app list --app-namespace namespace -o yaml
    rsp: |
      - metadata:
          creationTimestamp: "2024-07-12T13:42:50Z"
          name: bl01t-ea-test-01
        spec:
          source:
            targetRevision: main
        status:
          resources:
            - kind: StatefulSet
              name: bl01t-ea-test-01
  - cmd: argocd app get namespace/bl01t-ea-test-01 -o yaml
    rsp: |
      metadata:
        name: bl01t-ea-test-01
        annotations:
          epics-containers.github.io/description: old description
  - cmd: argocd app get namespace/bl01t -o yaml
    rsp: |
      spec:
        source:
          repoURL: https://github.com/test/example-deployment.git
          path: apps
  - cmd: git clone --depth=1 https://github.com/test/example-deployment.git /tmp/ec_tests
    rsp: ""
  - cmd: git add .
    rsp: ""
  - cmd: "git commit -m 'Set services.bl01t-ea-test-01.description=*"
    rsp: ""
  - cmd: git push
    rsp: ""
  - cmd: argocd app unset namespace/bl01t -p services.bl01t-ea-test-01.description
    rsp: ""
  - cmd: argocd app get --show-params namespace/bl01t -o json
    rsp: "{}"
  - cmd: argocd app get namespace/bl01t --refresh
    rsp: ""

# `ec set-desc` on a service with no services.<name> entry (and, here, not
# even a known Application) must refuse before any write: the repo is
# cloned to check, but nothing is committed or pushed.
set_desc_unknown_service:
  - cmd: argocd app get namespace/bl01t
    rsp: ""
  - cmd: argocd app list --app-namespace namespace -o yaml
    rsp: |
      - metadata:
          creationTimestamp: "2024-07-12T13:42:50Z"
