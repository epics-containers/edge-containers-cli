# `--desc` given: no read-back of the current description is needed for
# display, so unlike `deploy` above there's no `argocd app list` /
# `argocd app get <ns>/<svc> -o yaml` call before push_values. Also pushes
# the services.<name>.description key directly, and NEVER touches
# `labels` (the description is now an Application annotation, not a
# label) - that's what `deploy` above must not do either.
deploy_with_desc:
  - cmd: git clone https://github.com/epics-containers/bl01t-services /tmp/.*
    rsp: Cloning into /tmp/xxxx...
  - cmd: git tag --sort=committerdate
    rsp: |
      1.0
      2.0
  - cmd: git ls-tree -r 1.0 --name-only
    rsp: |
      services/bl01t-ea-test-01
