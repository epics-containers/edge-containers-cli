deploy_clears_override:
  # Same flow as `deploy`, but there's a lingering
  # `services.bl01t-ea-test-01.enabled.legacy=false` child parameter
  # override (e.g. left behind by an older ec/Monitor version). push_values
  # unsets child overrides for every key it pushes, so this still gets
  # cleared even though deploy now pushes each field (enabled,
  # targetRevision) at its own leaf key rather than the whole service
  # entry.
  - cmd: git clone https://github.com/epics-containers/bl01t-services /tmp/.*
    rsp: Cloning into /tmp/xxxx...
  - cmd: git tag --sort=committerdate
    rsp: |
      1.0
      2.0
  - cmd: git ls-tree -r 1.0 --name-only
    rsp: |
      services/bl01t-ea-test-01
